<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dungeon Quest Research</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 8 12v18c0 15 10 25 24 30 14-5 24-15 24-30V12z' fill='%236a4bb0' stroke='%23d9b45a' stroke-width='4'/%3E%3Cpath d='M32 16v32M22 26h20' stroke='%23d9b45a' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Reader for research/dungeon-quests/*.md. Same tokens as index.html. */
:root {
  --bg: #f3f1f6; --surface: #ffffff; --sunk: #e9e6ef; --line: #d6d1e0;
  --fg: #1f1b2b; --muted: #645d75;
  --accent: #6a4bb0; --accent-fg: #ffffff; --gold: #8a6712;
  --good: #1f7a4d; --warn: #9a5b00; --bad: #a8323a;
  --display: "Alegreya Sans SC", "Trebuchet MS", sans-serif;
  --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15121d; --surface: #1f1b2a; --sunk: #191522; --line: #353047;
  --fg: #ebe7f3; --muted: #a39cb6;
  --accent: #b39cf0; --accent-fg: #1a1528; --gold: #d9b45a;
  --good: #5fcf96; --warn: #e6a94a; --bad: #f0818a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15121d; --surface: #1f1b2a; --sunk: #191522; --line: #353047;
  --fg: #ebe7f3; --muted: #a39cb6;
  --accent: #b39cf0; --accent-fg: #1a1528; --gold: #d9b45a;
  --good: #5fcf96; --warn: #e6a94a; --bad: #f0818a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); margin: 0 }
.wrap { max-width: 820px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px }
h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: .02em; text-wrap: balance }
h1 { font-size: 28px; line-height: 1.1 } h2 { font-size: 19px }
p { margin: 0 } a { color: var(--accent) }
button, input { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) } .small { font-size: 13px }
nav { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 14px }
nav a[aria-current] { font-weight: 600; color: var(--fg); text-decoration: none }
.intro { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted) }
.bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line) }
.bar input[type=search] { flex: 1 1 240px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
.bar label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center }
details.c { border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
details.c > summary { cursor: pointer; padding: 12px 14px; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap }
details.c > summary::-webkit-details-marker { display: none }
details.c > summary .n { font: 12px var(--mono); color: var(--muted) }
.qs { list-style: none; margin: 0; padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px }
.q { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0 }
.q:first-child { border-top: 0; padding-top: 0 }
.qh { display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: baseline }
.qh b { font-weight: 600 }
.meta { font: 12px var(--mono); color: var(--muted) }
.row { font-size: 14px; overflow-wrap: anywhere } .row .k { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 6px }
.rew { color: var(--gold) }
.tag { font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; background: var(--sunk); color: var(--muted); white-space: nowrap }
.tag.go { background: var(--good); color: var(--bg) }
.way { font: 12px var(--mono); border: 1px dashed var(--line); background: transparent; border-radius: 5px; padding: 0 5px; cursor: pointer }
.idx { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden }
.idx li { border-top: 1px solid var(--line) } .idx li:first-child { border-top: 0 }
.idx a { display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px; text-decoration: none; color: var(--fg) }
.idx a:hover { background: var(--sunk) }
[hidden] { display: none !important }
</style></head><body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:8px">
    <p class="small"><a href="./">← Back to the tracker</a></p>
    <h1 id="title">Dungeon quest research</h1>
    <nav id="nav" aria-label="Research files"></nav>
  </header>
  <div class="intro" id="intro"></div>
  <div class="bar" id="bar" hidden>
    <input type="search" id="q" placeholder="Filter: quest, NPC, zone, item…" aria-label="Filter quests">
    <label><input type="checkbox" id="now"> Only quests I can take at level <span id="lv">?</span></label>
    <span class="small muted" id="count" role="status"></span>
  </div>
  <div id="out" style="display:flex;flex-direction:column;gap:10px"></div>
</div>
<script>
(function () {
  var FILES = [["alcaz", "Alcaz Prison"], ["st", "Sunken Temple"], ["brd", "Blackrock Depths"], ["dm", "Dire Maul"], ["blackmaw", "Blackmaw Hold"],
    ["brs", "Blackrock Spire"], ["strat", "Stratholme"], ["scholo", "Scholomance"], ["shaper", "Shaper's Terrace"], ["shared-chains", "Shared chains"]];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var bold = function (s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); };
  /* fetch as bytes and decode UTF-8 ourselves, so the page reads right whatever Content-Type the server sends */
  function getText(path) { return fetch(path, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(path + ": " + r.status); return r.arrayBuffer(); }).then(function (b) { return new TextDecoder("utf-8").decode(b); }); }
  var cur = new URLSearchParams(location.search).get("f") || "";
  var level = null;

  $("nav").innerHTML = '<a href="research.html"' + (cur ? "" : ' aria-current="page"') + ">All</a>" + FILES.map(function (f) {
    return '<a href="research.html?f=' + f[0] + '"' + (f[0] === cur ? ' aria-current="page"' : "") + ">" + esc(f[1]) + "</a>";
  }).join("");

  /* Parse the crawl's markdown: # title, intro lines, ## chain, "- **Name** (meta)" quest, "  - Key: value" rows. */
  function parse(md) {
    var doc = { title: "", intro: [], chains: [] }, chain = null, q = null;
    md.split(/\r?\n/).forEach(function (line) {
      var m;
      if (/^# /.test(line)) { doc.title = line.slice(2).trim(); return; }
      if (/^## /.test(line)) { chain = { head: line.slice(3).trim(), qs: [] }; doc.chains.push(chain); q = null; return; }
      if ((m = line.match(/^- \*\*(.+?)\*\* \((.*)\)\s*$/))) {
        if (!chain) { chain = { head: "Quests", qs: [] }; doc.chains.push(chain); }
        var meta = m[2], id = (meta.match(/quest (\d+)/) || [])[1], req = (meta.match(/requires (\d+)/) || [])[1], lvl = (meta.match(/level (\d+)/) || [])[1];
        q = { name: m[1], meta: meta, id: id, req: req ? +req : null, lvl: lvl ? +lvl : null, rows: [] }; chain.qs.push(q); return;
      }
      if ((m = line.match(/^\s+- ([^:]+): (.*)$/)) && q) { q.rows.push([m[1], m[2]]); return; }
      if (line.trim() && !chain) doc.intro.push(line.trim());
    });
    return doc;
  }

  function wayify(s) {
    /* "Tanaris (67.0, 22.4)" -> copyable /way button */
    return esc(s).replace(/\((\d{1,3}\.\d), (\d{1,3}\.\d)\)/g, function (_, x, y) { return '<button class="way" data-way="/way ' + x + " " + y + '" title="Copy TomTom waypoint">' + x + " " + y + "</button>"; });
  }

  function renderDoc(doc) {
    document.title = doc.title.replace(/: Horde quests and their chains$/, "") + " quests";
    $("title").textContent = doc.title;
    $("intro").innerHTML = doc.intro.map(function (l) { return "<p>" + bold(l) + "</p>"; }).join("");
    $("bar").hidden = false;
    $("out").innerHTML = doc.chains.map(function (c, ci) {
      return '<details class="c" open data-c="' + ci + '"><summary><h2>' + esc(c.head) + '</h2><span class="n"></span></summary><ul class="qs">' + c.qs.map(function (q) {
        var links = q.id ? ' <a class="small" href="https://everlookdb.com/quest/' + q.id + '" target="_blank" rel="noopener">EverlookDB</a> <a class="small" href="https://www.wowhead.com/forever/quest=' + q.id + '" target="_blank" rel="noopener">Wowhead</a>' : "";
        return '<li class="q" data-req="' + (q.req || 0) + '" data-text="' + esc((q.name + " " + q.meta + " " + q.rows.map(function (r) { return r.join(" "); }).join(" ")).toLowerCase()) + '">' +
          '<div class="qh"><b>' + esc(q.name) + '</b><span class="tag" data-go></span>' + links + "</div>" +
          '<div class="meta">' + esc(q.meta) + "</div>" +
          q.rows.map(function (r) { return '<div class="row' + (r[0] === "Reward" ? " rew" : "") + '"><span class="k">' + esc(r[0]) + "</span>" + wayify(r[1]) + "</div>"; }).join("") + "</li>";
      }).join("") + "</ul></details>";
    }).join("");
    filter();
  }

  function filter() {
    var words = $("q").value.toLowerCase().split(/\s+/).filter(Boolean), onlyNow = $("now").checked && level != null, shown = 0, total = 0;
    [].forEach.call(document.querySelectorAll("details.c"), function (c) {
      var vis = 0, qs = c.querySelectorAll(".q");
      [].forEach.call(qs, function (q) {
        var req = +q.dataset.req, ok = words.every(function (w) { return q.dataset.text.indexOf(w) >= 0; }) && (!onlyNow || req <= level);
        q.hidden = !ok; if (ok) vis++;
        var tag = q.querySelector("[data-go]");
        if (level != null && req) { tag.hidden = false; tag.textContent = req <= level ? "can take" : "at " + req; tag.className = "tag" + (req <= level ? " go" : ""); } else tag.hidden = true;
      });
      c.hidden = !vis; shown += vis; total += qs.length;
      c.querySelector(".n").textContent = vis === qs.length ? qs.length + (qs.length === 1 ? " quest" : " quests") : vis + " of " + qs.length;
    });
    $("count").textContent = shown === total ? total + " quests" : shown + " of " + total + " quests";
  }

  function renderIndex() {
    $("intro").innerHTML = "<p>Every Horde quest a paladin can take for the remaining 48–60 dungeons, with full chains, read from EverlookDB (WoW Forever client) on 2026-11-25. Refresh with <code>python research/crawl_dungeon_quests.py</code>.</p>";
    $("out").innerHTML = '<ul class="idx" id="idx">' + FILES.map(function (f) { return '<li><a href="research.html?f=' + f[0] + '"><span>' + esc(f[1]) + '</span><span class="small muted" data-n="' + f[0] + '">…</span></a></li>'; }).join("") + "</ul>";
    FILES.forEach(function (f) {
      getText("research/dungeon-quests/" + f[0] + ".md").then(function (md) {
        var d = parse(md), n = d.chains.reduce(function (a, c) { return a + c.qs.length; }, 0), ch = d.chains.filter(function (c) { return c.qs.length > 1; }).length;
        document.querySelector('[data-n="' + f[0] + '"]').textContent = n + " quests · " + ch + " chain" + (ch === 1 ? "" : "s");
      }, function () { document.querySelector('[data-n="' + f[0] + '"]').textContent = "missing"; });
    });
  }

  document.addEventListener("input", function (e) { if (e.target.id === "q") filter(); });
  document.addEventListener("change", function (e) { if (e.target.id === "now") filter(); });
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button.way"); if (!b) return;
    e.preventDefault();
    var old = b.textContent;
    try { navigator.clipboard.writeText(b.dataset.way).then(function () { b.textContent = "copied"; setTimeout(function () { b.textContent = old; }, 900); }, function () {}); } catch (err) {}
  });

  /* character level from the tracker's saved state, when the server is running */
  fetch("api/state", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (st) {
    if (st && st.character && st.character.level) { level = +st.character.level; $("lv").textContent = level; if (cur) filter(); }
  }, function () {}).then(function () { if (level == null) $("now").disabled = true; });

  if (!cur) return renderIndex();
  if (!FILES.some(function (f) { return f[0] === cur; })) { $("out").innerHTML = '<p class="muted">No research file named “' + esc(cur) + '”.</p>'; return; }
  getText("research/dungeon-quests/" + cur + ".md").then(function (md) { renderDoc(parse(md)); },
    function (e) { $("out").innerHTML = '<p class="muted">Could not load the file (' + esc(e.message) + "). Open this page through the tracker server.</p>"; });
})();
</script>
</body></html>
